<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Notes</h1>
      <form id="note-form">
        <label for="note-input">New note</label>
        <input id="note-input" name="note" type="text" autocomplete="off" />
        <button type="submit">Add note</button>
      </form>
      <p id="note-error" role="alert"></p>
      <ul id="note-list"></ul>
    </main>
    <script type="module" src="src/notes-page.js"></script>
  </body>
</html>
